name: ci

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: pip install pytest

      - name: Shell syntax
        run: |
          find scripts configs tests -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Python syntax
        run: python -m compileall -q src tests 3drc.py

      - name: Unit tests
        run: pytest -q tests
