name: 3drc
channels:
  - defaults
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy>=1.23.0
  - scipy>=1.9.0
  - pandas>=1.5.0
  - h5py>=3.7.0
  - tqdm>=4.64.0
  - opencv>=4.6.0
  - matplotlib>=3.5.0
  - pycolmap>=3.13.0
  - pyyaml
  - plyfile
  - open3d
  - trimesh
  - ninja
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - torchaudio==2.11.0+cu128
      - lightglue>=0.2
      - pydegensac
      - pyquaternion
      - pyrender
      - pyglet<2.0.0
